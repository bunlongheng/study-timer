<!DOCTYPE html>
<html lang="en">
    <head>
        <link rel="icon" href="/favicon.ico" sizes="any" />
        <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32x32.png" />
        <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16x16.png" />
        <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
        <meta name="theme-color" content="#000000" />
        <meta name="mobile-web-app-capable" content="yes" />
        <meta name="apple-mobile-web-app-capable" content="yes" />
        <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
        <meta name="apple-mobile-web-app-title" content="Study" />
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta
            name="description"
            content="A calm, offline-ready study timer for kids. Pick a study mode, run the circular countdown, and celebrate when the session completes."
        />
        <title>Study Timer</title>
        <style>
            html,
            body {
                margin: 0;
                background: #000;
            }
            /* Instant first paint so the screen never flashes white before React
               mounts. Removed the moment the app renders into #root. */
            #root:empty::before {
                content: '';
                position: fixed;
                inset: 0;
                display: block;
                background:
                    radial-gradient(circle at 50% 45%, rgba(90, 178, 255, 0.12), transparent 55%),
                    #000;
            }
        </style>
    </head>
    <body>
        <div id="root"></div>
        <script type="module" src="/src/main.tsx"></script>
    </body>
</html>
